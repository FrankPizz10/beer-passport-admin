# Install at .github/workflows/api-image.yml through an approved PR.
name: Build API image
on:
  push:
    branches: [master]
    paths: ["server/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          load: true
          tags: beerpassport-admin-api:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: beerpassport-admin-api:ci
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Release handoff
        run: echo "Image built and scanned; publication and deployment require explicit approval." >> "$GITHUB_STEP_SUMMARY"
