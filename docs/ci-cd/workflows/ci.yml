# Install at .github/workflows/ci.yml
#
# This workflow is delivered as a documentation copy under docs/ci-cd/workflows/
# because the agent's GitHub App cannot push files under .github/workflows/
# (403, verified 2026-11-23). A human installs it once by copying this file to
# .github/workflows/ci.yml (GitHub web UI or a local push). See
# docs/ci-cd/RUNBOOK.md, "One-time setup checklist".
#
# What it does: on every pull request and every push to master, build and test
# the CRA client (repo root) and the Express/Prisma API (server/). It deploys
# nothing and needs no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# Cancel superseded runs for pull requests; never cancel a master run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client:
    name: Client (CRA, repo root)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install client dependencies
        run: npm ci

      # CI=true makes react-scripts test run once and exit, and makes the
      # production build treat lint warnings as errors (this is the exact
      # mode that caught the jsx-a11y error in the PR #12 Netlify preview).
      - name: Client tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Client production build
        run: npm run build
        env:
          CI: true

  server:
    name: API (Express + Prisma, server/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: API type-check and build (tsc)
        run: npm run build

      # The Jest suite is unit/integration tests with injected clients; the
      # live-database suite stays skipped without a test DATABASE_URL.
      - name: API tests
        run: npm test
